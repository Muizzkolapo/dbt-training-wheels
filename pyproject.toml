[project]
name = "dbt-training-wheels"
version = "0.1.0"
description = "SQL to dbt Migration Tool - Convert BigQuery scheduled queries to production-ready dbt models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["dbt", "bigquery", "sql", "migration", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "flask>=3.0.0",
    "flask-wtf>=1.2.0",
    "werkzeug>=3.0.1",
    "pyyaml>=6.0",
    "sqlglot>=20.0.0",
    "gunicorn>=21.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "urllib3>=2.6.3",  # Fix security vulnerability GHSA-38jv-5279-wg99
]

[project.scripts]
dbt-training-wheels = "dbt_training_wheels.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "responses>=0.24.0,<0.25.0",
    "ruff>=0.8.0,<0.9.0",
    "mypy>=1.13.0,<2.0.0",
    "types-pyyaml>=6.0.0,<7.0.0",
    "types-requests>=2.32.0,<3.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "detect-secrets>=1.5.0,<2.0.0",
    "vulture>=2.13,<3.0.0",
    "filelock==3.20.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbt_training_wheels"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "vulture_whitelist.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict parameter
]

[tool.ruff.lint.isort]
known-first-party = ["dbt_training_wheels"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Enable gradually
disallow_incomplete_defs = false  # Enable gradually
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

# Gradually enable strict mode per-module
# Note: file_generator and analysis_service have TypedDict compatibility issues
# that need to be resolved before enabling strict mode
[[tool.mypy.overrides]]
module = ["dbt_training_wheels.services.file_generator", "dbt_training_wheels.services.analysis_service"]
disallow_untyped_defs = false
warn_return_any = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["dbt_training_wheels"]
omit = ["tests/*", "dbt_training_wheels/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
