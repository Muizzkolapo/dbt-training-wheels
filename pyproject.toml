[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbt-training-wheels"
version = "0.1.0.dev0"
description = "Training wheels for dbt: convert raw SQL into dbt models that match your project's conventions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "sqlglot>=30,<31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
dbtw = "dbtw.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbtw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
